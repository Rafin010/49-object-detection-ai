name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ]; then pip install pytest && pytest -q; else echo 'No tests directory; compile check completed.'; fi
      - name: Package source
        run: tar --exclude='__pycache__' --exclude='.git' -czf source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-artifact
          path: source.tar.gz
          retention-days: 14

  release:
    name: Release tagged artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-artifact
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}.tar.gz" -C release .
          gh release create "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}.tar.gz" --generate-notes --repo "$GITHUB_REPOSITORY"
